# Empacotamento da extensao Python (maturin). Com este arquivo valem:
#   maturin develop --release        instala no venv ativo, para desenvolver
#   maturin build --release -o dist  gera o wheel
#   pip install .                    compila e instala a partir do fonte
# O wheel e abi3: um arquivo por sistema, para todo Python de 3.10 em diante.
[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "multimerge-genomics"
description = "Genomics tools for files of any size: validate, sort, index and query VCF/BED/GFF/SAM/BAM; interval operations; VCF filter and normalization; FASTQ quality report and trimming; k-mer counting; BGZF, BAM and Parquet in and out; optional CUDA acceleration."
readme = "README.md"
requires-python = ">=3.10"
# A versao vem do Cargo.toml.
dynamic = ["version"]
keywords = ["bioinformatics", "genomics", "vcf", "bed", "gff", "bam", "fastq", "parquet", "tabix", "sorting", "k-mer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
# The AI assistant (explain a result, describe your problem, the agent) and the
# MCP server are optional: the tools themselves need neither.
ai = ["anthropic>=2.8"]
mcp = ["mcp>=2.3"]
# The web interface (mmgen-ui). marimo is held to the versions it was tested
# with (0.23.11 to 0.25.x): a newer one may change what the screens rely on.
ui = ["marimo>=0.23.11,<0.26", "polars>=1.0", "numpy", "scikit-learn>=1.3", "pyarrow"]

[project.scripts]
mmgen-mcp = "multimerge_genomics.mcp_server:main"
mmgen-ui = "multimerge_genomics.ui:main"

[tool.maturin]
bindings = "pyo3"
# Pacote misto: o motor Rust é multimerge_genomics._native, e python/ traz o
# __init__.py que o reexporta, o assistente de IA e o servidor MCP.
python-source = "python"
module-name = "multimerge_genomics._native"
