<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FASTQ quality report</title>
<style>
:root { color-scheme: light dark; }
.viz-root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --track: #cde2fb; --warning: #fab219; --good: #0ca30c;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --track: #184f95; --warning: #fab219; --good: #0ca30c;
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --page: #0d0d0d; --surface-1: #1a1a19;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --track: #184f95; --warning: #fab219; --good: #0ca30c;
}
html, body { margin: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh; padding: 24px 16px 48px; box-sizing: border-box; }
.wrap { max-width: 1080px; margin: 0 auto; overflow-wrap: anywhere; }
h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; overflow-wrap: anywhere; }
.sub { color: var(--text-secondary); font-size: 14px; margin: 0 0 20px; overflow-wrap: anywhere; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.tile, .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; }
.tile { padding: 12px 14px; }
.tile .label { color: var(--text-secondary); font-size: 13px; }
.tile .value { font-size: 24px; font-weight: 600; margin-top: 2px; }
.tile .note { color: var(--muted); font-size: 12px; margin-top: 2px; }
.card { padding: 16px; margin-bottom: 16px; }
.card h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
.card .caption { color: var(--text-secondary); font-size: 13px; margin: 0 0 10px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.cols .card { margin-bottom: 0; }
.cols { margin-bottom: 16px; }
.notes { list-style: none; margin: 0; padding: 0; }
.notes li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; padding: 6px 0; }
.notes svg { flex: 0 0 18px; margin-top: 1px; }
.plot { position: relative; }
.plot svg { display: block; width: 100%; overflow: visible; }
.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.axis-title { fill: var(--text-secondary); font-size: 12px; }
.end-label { fill: var(--text-secondary); font-size: 12px; font-weight: 600; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: var(--axis); stroke-width: 1; }
.line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.leader { stroke: var(--axis); stroke-width: 1; }
.s1 { stroke: var(--series-1); } .s2 { stroke: var(--series-2); } .s3 { stroke: var(--series-3); } .s4 { stroke: var(--series-4); }
.f1 { fill: var(--series-1); } .f2 { fill: var(--series-2); } .f3 { fill: var(--series-3); } .f4 { fill: var(--series-4); }
.bar { fill: var(--series-1); }
.bar.hot { opacity: 0.75; }
.cross { stroke: var(--axis); stroke-width: 1; }
.dot { stroke: var(--surface-1); stroke-width: 2; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-secondary); margin: 0 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key-line { width: 14px; height: 2px; border-radius: 1px; }
.key-band { width: 14px; height: 10px; border-radius: 2px; background: var(--series-1); }
.tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); min-width: 120px; z-index: 2; display: none; }
.tip .head { color: var(--text-secondary); margin-bottom: 4px; }
.tip .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; white-space: nowrap; }
.tip .row b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tip .name { color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }
details { margin-top: 10px; font-size: 13px; }
summary { cursor: pointer; color: var(--text-secondary); }
.table-wrap { max-height: 320px; overflow: auto; margin-top: 8px; border: 1px solid var(--border); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 4px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface-1); color: var(--text-secondary); font-weight: 600; }
th:first-child, td:first-child { text-align: left; }
.meters { display: grid; gap: 8px; font-size: 13px; }
.meter { display: grid; grid-template-columns: minmax(120px, 220px) 1fr minmax(110px, auto); gap: 4px 12px; align-items: center; }
.meters .track { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.meters .fill { height: 100%; border-radius: 4px; background: var(--series-1); }
.meters .num { font-variant-numeric: tabular-nums; text-align: right; color: var(--text-primary); }
.meters .who { color: var(--text-secondary); }
.plain { font-size: 14px; color: var(--text-secondary); margin: 0; }
footer { color: var(--muted); font-size: 12px; margin-top: 24px; }
@media (max-width: 640px) {
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .meter { grid-template-columns: 1fr auto; }
  .meter .track { grid-column: 1 / -1; grid-row: 2; }
}
</style>
</head>
<body>
<main class="viz-root"><div class="wrap">
  <h1 id="title">FASTQ quality report</h1>
  <p class="sub" id="subtitle"></p>
  <section class="tiles" id="tiles" aria-label="Summary"></section>
  <section class="card" id="notes-card"><h2>Automatic checks</h2><ul class="notes" id="notes"></ul></section>
  <div id="charts"></div>
  <footer id="foot"></footer>
</div></main>
<script type="application/json" id="data">__MMGEN_DATA__</script>

          { name: "Median", value: String(P.q50[i]), n: 1 },
          { name: "Mean", value: fixed(P.mean_quality[i], 1) },
          { name: "25th to 75th", value: P.q25[i] + " to " + P.q75[i] },
          { name: "10th to 90th", value: P.q10[i] + " to " + P.q90[i] },
          { name: "Bases here", value: full(P.bases[i]) }] };
      },
      table: { head: ["Position", "Bases", "Mean", "10th", "25th", "Median", "75th", "90th"],
        rows: function () { return pos.map(function (p, i) { return [p, full(P.bases[i]), fixed(P.mean_quality[i], 1), P.q10[i], P.q25[i], P.q50[i], P.q75[i], P.q90[i]]; }); } }
    });

    // ---------- 2. base composition along the read ----------
    var pct = { a: [], c: [], g: [], t: [], n: [] }, maxN = 0;
    for (var i = 0; i < n; i++) {
      var tot = P.a[i] + P.c[i] + P.g[i] + P.t[i] + P.n[i] || 1;
      ["a", "c", "g", "t", "n"].forEach(function (k) { pct[k].push(P[k][i] / tot * 100); });
      maxN = Math.max(maxN, pct.n[i]);
    }
    var bases = [["a", "A", 1], ["c", "C", 2], ["g", "G", 3], ["t", "T", 4]];
    var peak = Math.max.apply(null, bases.map(function (b) { return Math.max.apply(null, pct[b[0]]); }));
    chart(charts, {
      title: "Base composition along the read",
      caption: "Share of each base at each position. In a random library the four lines run flat and close together; a jump at the start or the end points to adapters or primers.",
      legend: bases.map(function (b) { return { n: b[2], text: b[1] }; }),
      xMin: 1, xMax: Math.max(2, n), yMax: Math.min(100, Math.max(50, Math.ceil(peak / 10) * 10)), xWhole: true, ySuffix: "%",
      xTitle: "Position in the read", height: 280, endRoom: 34,
      draw: function (g, sx, sy, plot) {
        bases.forEach(function (b) { sv("path", { d: path(pos, pct[b[0]], sx, sy), "class": "line s" + b[2] }, g); });
        // End labels, kept apart; a leader line ties each one to its line.
        var ends = bases.map(function (b) { return { text: b[1], y: sy(pct[b[0]][n - 1]) }; }).sort(function (p, q) { return p.y - q.y; });
        ends.forEach(function (e) { e.at = e.y; });
        for (var k = 1; k < ends.length; k++) if (ends[k].at - ends[k - 1].at < 14) ends[k].at = ends[k - 1].at + 14;
        var over = ends[ends.length - 1].at - plot.bottom;
        if (over > 0) ends.forEach(function (e) { e.at -= over; });
        ends.forEach(function (e) {
          sv("line", { "class": "leader", x1: plot.right + 2, y1: e.y, x2: plot.right + 12, y2: e.at }, g);
          sv("text", { "class": "end-label", x: plot.right + 15, y: e.at + 4 }, g, e.text);
        });
      },
      snap: function (x) { return Math.min(n, Math.max(1, Math.round(x))); },
      tip: function (x) {
        var i = x - 1;
        return { x: x, head: "Position " + full(x),
          dots: bases.map(function (b) { return { y: pct[b[0]][i], n: b[2] }; }),
          rows: bases.map(function (b) { return { name: b[1], value: fixed(pct[b[0]][i], 1) + "%", n: b[2] }; })
            .concat([{ name: "N", value: fixed(pct.n[i], 2) + "%" }]) };
      },
      table: { head: ["Position", "A %", "C %", "G %", "T %", "N %"],
        rows: function () { return pos.map(function (p, i) { return [p, fixed(pct.a[i], 2), fixed(pct.c[i], 2), fixed(pct.g[i], 2), fixed(pct.t[i], 2), fixed(pct.n[i], 3)]; }); } }
    });

    // ---------- 3. N along the read ----------
    if (maxN > 0) {
      chart(charts, {
        title: "Unread bases (N) along the read",
        caption: "Share of bases the sequencer could not call, at each position.",
        xMin: 1, xMax: Math.max(2, n), yMax: Math.max(1, niceStep(maxN, 1) >= maxN ? niceStep(maxN, 1) : Math.ceil(maxN)), xWhole: true, ySuffix: "%",
        xTitle: "Position in the read", height: 200,
        draw: function (g, sx, sy, plot) {
          sv("path", { d: path(pos, pct.n, sx, sy) + "L" + sx(n).toFixed(1) + " " + plot.bottom + "L" + sx(1).toFixed(1) + " " + plot.bottom + "Z", "class": "f1", opacity: 0.1 }, g);
          sv("path", { d: path(pos, pct.n, sx, sy), "class": "line s1" }, g);
        },
        snap: function (x) { return Math.min(n, Math.max(1, Math.round(x))); },
        tip: function (x) { return { x: x, head: "Position " + full(x), dots: [{ y: pct.n[x - 1], n: 1 }], rows: [{ name: "N", value: fixed(pct.n[x - 1], 3) + "%", n: 1 }, { name: "N bases", value: full(P.n[x - 1]) }] }; }
      });
    }
  }

  var pair = el("div", { "class": "cols" }, charts);

  // ---------- 4. quality per read ----------
  var rq = D.read_quality_histogram || [], last = 0;
  rq.forEach(function (v, i) { if (v) last = i; });
  var qTop = Math.max(40, last), qx = [], qy = [];
  for (var q = 0; q <= qTop; q++) { qx.push(q); qy.push(rq[q] || 0); }
  chart(pair, {
    title: "Quality per read",
    caption: "How many reads have each mean Phred quality.",
    xMin: -0.6, xMax: qTop + 0.6, yMax: Math.max.apply(null, qy) || 1, xWhole: true, yWhole: true, xTitle: "Mean quality of the read",
    draw: function (g, sx, sy, plot) { columns(g, qx, qy, sx, sy, plot, plot.width / (qTop + 1.2)); },
    snap: function (x) { return Math.min(qTop, Math.max(0, Math.round(x))); },
    tip: function (x) { return { x: x, head: "Mean quality " + x, rows: [{ name: "Reads", value: full(qy[x]), n: 1 }, { name: "Share", value: fixed(qy[x] / D.reads * 100, 2) + "%" }] }; },
    table: { head: ["Mean quality", "Reads"], rows: function () { return qx.filter(function (x) { return qy[x]; }).map(function (x) { return [x, full(qy[x])]; }); } }
  });

  // ---------- 5. GC per read ----------
  var gc = D.gc_histogram || [], gx = gc.map(function (_, i) { return i; }), gcTotal = gc.reduce(function (a, b) { return a + b; }, 0) || 1;
  chart(pair, {
    title: "GC content per read",
    caption: "How many reads have each GC percentage. One smooth peak is the usual shape; a second peak can mean contamination.",
    xMin: 0, xMax: 100, yMax: Math.max.apply(null, gc) || 1, yWhole: true, xSuffix: "%", xTitle: "GC content of the read",
    draw: function (g, sx, sy, plot) {
      sv("path", { d: path(gx, gc, sx, sy) + "L" + sx(100).toFixed(1) + " " + plot.bottom + "L" + sx(0).toFixed(1) + " " + plot.bottom + "Z", "class": "f1", opacity: 0.1 }, g);
      sv("path", { d: path(gx, gc, sx, sy), "class": "line s1" }, g);
    },
    snap: function (x) { return Math.min(100, Math.max(0, Math.round(x))); },
    tip: function (x) { return { x: x, head: "GC " + x + "%", dots: [{ y: gc[x], n: 1 }], rows: [{ name: "Reads", value: full(gc[x]), n: 1 }, { name: "Share", value: fixed(gc[x] / gcTotal * 100, 2) + "%" }] }; },
    table: { head: ["GC %", "Reads"], rows: function () { return gx.filter(function (x) { return gc[x]; }).map(function (x) { return [x, full(gc[x])]; }); } }
  });

  // ---------- 6. read lengths ----------
  var lens = D.length_histogram || [];
  if (lens.length <= 1) {
    var one = el("section", { "class": "card" }, charts);
    el("h2", {}, one, "Read lengths");
    el("p", { "class": "plain" }, one, "Every read has " + full(D.max_length) + " bases.");
  } else {
    var lo = D.min_length, hi = D.max_length, bins = Math.min(50, hi - lo + 1), size = Math.ceil((hi - lo + 1) / bins);
    bins = Math.ceil((hi - lo + 1) / size);
    var by = [], bx = [];
    for (var b = 0; b < bins; b++) { by.push(0); bx.push(b); }
    lens.forEach(function (p) { by[Math.floor((p[0] - lo) / size)] += p[1]; });
    var label = function (b) { var a = lo + b * size, z = Math.min(hi, a + size - 1); return size === 1 ? full(a) : full(a) + " to " + full(z); };
    chart(charts, {
      title: "Read lengths",
      caption: "How many reads have each length" + (size > 1 ? ", in groups of " + full(size) + " bases." : "."),
      xMin: lo - size * 0.6, xMax: lo + (bins - 1) * size + size * 0.6, yMax: Math.max.apply(null, by) || 1, xWhole: true, yWhole: true,
      xTitle: "Read length (bases)", height: 220,
      draw: function (g, sx, sy, plot) { columns(g, bx.map(function (b) { return lo + b * size; }), by, sx, sy, plot, plot.width / (bins + 0.2)); },
      snap: function (x) { return lo + Math.min(bins - 1, Math.max(0, Math.round((x - lo) / size))) * size; },
      tip: function (x) { var b = Math.round((x - lo) / size); return { x: x, head: label(b) + " bases", rows: [{ name: "Reads", value: full(by[b]), n: 1 }, { name: "Share", value: fixed(by[b] / D.reads * 100, 2) + "%" }] }; },
      keyStep: size,
      table: { head: ["Length", "Reads"], rows: function () { return bx.filter(function (b) { return by[b]; }).map(function (b) { return [label(b), full(by[b])]; }); } }
    });
  }

  // ---------- 7. adapters ----------
  var ad = el("section", { "class": "card" }, charts);
  el("h2", {}, ad, "Adapter sequences");
  el("p", { "class": "caption" }, ad, "Share of reads that contain the start of each known adapter. Each bar runs from 0 to 100% of the reads.");
  var meters = el("div", { "class": "meters" }, ad);
  (D.adapters || []).forEach(function (a) {
    var row = el("div", { "class": "meter" }, meters);
    el("div", { "class": "who" }, row, a.name);
    var tr = el("div", { "class": "track", role: "meter", "aria-valuemin": 0, "aria-valuemax": 100, "aria-valuenow": a.percent, "aria-label": a.name }, row);
    var f = el("div", { "class": "fill" }, tr);
    f.style.width = a.percent > 0 ? "max(2px, " + a.percent + "%)" : "0";
    el("div", { "class": "num" }, row, fixed(a.percent, a.percent > 0 && a.percent < 0.1 ? 3 : 2) + "% (" + full(a.reads) + ")");
  });
  if (D.likely_adapter) {
    el("p", { "class": "plain" }, ad, "Most likely adapter: " + D.likely_adapter.name + " (" + D.likely_adapter.sequence + ").").style.marginTop = "10px";
  }

  document.getElementById("foot").textContent = "Made with MMGEN (MultiMerge Genomics) __MMGEN_VERSION__. Source file: " + (D.path || "");
})();
</script>
</body>
</html>
