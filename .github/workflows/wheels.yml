# Builds the wheels (Linux, Windows, macOS) and, on a `v*` tag, attaches them to
# a GitHub Release. Publishing to PyPI is optional: it only happens when the
# repository variable PUBLISH_TO_PYPI is "true".
#
# These wheels are CPU-only: GitHub's machines do not have the CUDA toolkit.
# Every module works (with the same results); whoever wants the GPU builds on
# their own machine with `maturin develop --release`.
#
# WRITTEN ON 2026-11-13 AND NOT YET RUN: nothing has been pushed to GitHub.
# Before trusting a tag, run it once by hand (Actions -> wheels -> Run workflow).
name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest,  target: x86_64,  test: true }
          - { name: windows-x64,    os: windows-latest, target: x64,     test: true }
          - { name: macos-arm64,    os: macos-latest,   target: aarch64, test: true }
          - { name: macos-x86_64,   os: macos-latest,   target: x86_64,  test: false }
    env:
      MULTIMERGE_CPU_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
          docker-options: -e MULTIMERGE_CPU_ONLY=1
      - name: Install and check
        if: matrix.test
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist multimerge-genomics
          python trials/python/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true

  pypi:
    name: PyPI
    needs: wheels
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing, no stored password
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
